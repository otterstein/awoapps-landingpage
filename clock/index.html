<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Clock by AWOApps</title>
  <script>
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const packageName = "com.awoapps.chessclock";
    const appStoreUrl = "https://apps.apple.com/app/DEINE_APP_ID"; // iOS

    window.onload = function() {
      // 1. Erkennung iOS (iPhone / iPad)
      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.href = appStoreUrl;
      } 
      // 2. Android
      else if (/android/i.test(userAgent)) {
        // Zwingt Android, die native Google Play Store App zu starten
        window.location.href = "market://details?id=" + packageName;

        // Fallback: Falls der Intent nicht greift, nach 1,5 Sek. zur Webversion
        setTimeout(function() {
          window.location.href = "https://play.google.com/store/apps/details?id=" + packageName;
        }, 1500);
      } 
      // 3. Desktop / Windows / Mac
      else {
        window.location.href = "https://play.google.com/store/apps/details?id=" + packageName;
      }
    };
  </script>
</head>
<body style="background:#121212; color:#fff; font-family:sans-serif; text-align:center; padding-top:20vh;">
  <p>Weiterleitung zu <strong>Chess Clock by AWOApps</strong>...</p>
  <p>
    <a href="market://details?id=com.awoapps.chessclock" style="color:#2dd4bf; text-decoration:underline;">
      Hier tippen, falls der Play Store nicht automatisch öffnet
    </a>
  </p>
</body>
</html>
